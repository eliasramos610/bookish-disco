<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Fleet | DriveEase Car Rentals</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 font-sans text-slate-800">

    <!-- Navigation -->
    <nav class="flex items-center justify-between px-10 py-6 bg-white shadow-sm sticky top-0 z-50">
        <div class="text-2xl font-bold text-blue-600 tracking-tighter">
            <i class="fas fa-car-side mr-2"></i>DRIVE<span class="text-gray-800">EASE</span>
        </div>
        <div class="hidden md:flex space-x-8 font-medium text-gray-600">
            <a href="index.html" class="hover:text-blue-600 transition">Home</a>
            <a href="fleets.html#" class="text-blue-600 font-bold">Fleet</a>
            <a href="deals.html" class="hover:text-blue-600 transition">Deals</a>
            <a href="contact.html" class="hover:text-blue-600 transition">Contact</a>
        </div>
        <button class="bg-blue-600 text-white px-6 py-2 rounded-full font-semibold hover:bg-blue-700 transition">Book Now</button>
    </nav>

    <div class="container mx-auto px-6 py-10">
        <div class="flex flex-col lg:flex-row gap-8">
            
            <!-- Left Filter Panel -->
            <aside class="lg:w-1/4 bg-white p-6 rounded-2xl shadow-sm border border-slate-100 h-fit sticky top-28">
                <h2 class="text-xl font-bold mb-6 flex items-center">
                    <i class="fas fa-sliders-h mr-2 text-blue-600"></i> Filters
                </h2>

                <!-- Vehicle Type -->
                <div class="mb-6">
                    <h3 class="font-bold text-sm uppercase text-slate-500 mb-3">Vehicle Type</h3>
                    <div class="space-y-2">
                        <label class="flex items-center cursor-pointer"><input type="checkbox" class="filter-check mr-2" value="Sedan"> Sedan</label>
                        <label class="flex items-center cursor-pointer"><input type="checkbox" class="filter-check mr-2" value="SUV"> SUV</label>
                        <label class="flex items-center cursor-pointer"><input type="checkbox" class="filter-check mr-2" value="Truck"> Truck</label>
                        <label class="flex items-center cursor-pointer"><input type="checkbox" class="filter-check mr-2" value="Luxury"> Luxury</label>
                        <label class="flex items-center cursor-pointer"><input type="checkbox" class="filter-check mr-2" value="Electric"> Electric</label>
                    </div>
                </div>

                <!-- Size -->
                <div class="mb-6">
                    <h3 class="font-bold text-sm uppercase text-slate-500 mb-3">Size</h3>
                    <div class="space-y-2">
                        <label class="flex items-center cursor-pointer"><input type="checkbox" class="filter-check mr-2" value="Compact"> Compact</label>
                        <label class="flex items-center cursor-pointer"><input type="checkbox" class="filter-check mr-2" value="Mid-Size"> Mid-Size</label>
                        <label class="flex items-center cursor-pointer"><input type="checkbox" class="filter-check mr-2" value="Full-Size"> Full-Size</label>
                    </div>
                </div>

                <!-- Transmission -->
                <div class="mb-6">
                    <h3 class="font-bold text-sm uppercase text-slate-500 mb-3">Transmission</h3>
                    <div class="space-y-2">
                        <label class="flex items-center cursor-pointer"><input type="checkbox" class="filter-check mr-2" value="Automatic"> Automatic</label>
                        <label class="flex items-center cursor-pointer"><input type="checkbox" class="filter-check mr-2" value="Manual"> Manual</label>
                    </div>
                </div>

                <button id="clearFilters" class="w-full py-2 text-sm text-blue-600 font-bold border border-blue-600 rounded-lg hover:bg-blue-50 transition">Clear All Filters</button>
            </aside>

            <!-- Fleet Grid -->
            <main class="lg:w-3/4">
                <div class="flex justify-between items-center mb-8">
                    <h1 class="text-3xl font-bold text-slate-900">Explore Our Fleet</h1>
                    <span class="text-slate-500 font-medium" id="carCount">Showing 20 cars</span>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6" id="fleetGrid">
                    <!-- Cars will be injected here via JavaScript -->
                </div>
            </main>
        </div>
    </div>

    <script>
        const cars = [
            { name: "Toyota Corolla", type: "Sedan", size: "Compact", trans: "Automatic", fuel: "Gas", price: 45, img: "https://images.unsplash.com/photo-1623854281319-7d0719881600?auto=format&fit=crop&q=80&w=400" },
            { name: "Tesla Model 3", type: "Electric", size: "Mid-Size", trans: "Automatic", fuel: "Electric", price: 85, img: "https://images.unsplash.com/photo-1560958089-b8a1929cea89?auto=format&fit=crop&q=80&w=400" },
            { name: "Jeep Wrangler", type: "SUV", size: "Mid-Size", trans: "Manual", fuel: "Gas", price: 95, img: "https://images.unsplash.com/photo-1533473359331-0135ef1b58bf?auto=format&fit=crop&q=80&w=400" },
            { name: "Ford F-150", type: "Truck", size: "Full-Size", trans: "Automatic", fuel: "Gas", price: 110, img: "https://images.unsplash.com/photo-1583121274602-3e2820c69888?auto=format&fit=crop&q=80&w=400" },
            { name: "BMW 5 Series", type: "Luxury", size: "Mid-Size", trans: "Automatic", fuel: "Gas", price: 150, img: "https://images.unsplash.com/photo-1555215695-3004980ad54e?auto=format&fit=crop&q=80&w=400" },
            { name: "Honda Civic", type: "Sedan", size: "Compact", trans: "Automatic", fuel: "Gas", price: 42, img: "https://images.unsplash.com/photo-1605559424843-9e4c228bf1c2?auto=format&fit=crop&q=80&w=400" },
            { name: "Range Rover Sport", type: "Luxury", size: "Full-Size", trans: "Automatic", fuel: "Gas", price: 220, img: "https://images.unsplash.com/photo-1606611013016-969c19ba27bb?auto=format&fit=crop&q=80&w=400" },
            { name: "Chevrolet Tahoe", type: "SUV", size: "Full-Size", trans: "Automatic", fuel: "Gas", price: 130, img: "https://images.unsplash.com/photo-1517524008436-bbdb53c54434?auto=format&fit=crop&q=80&w=400" },
            { name: "Mazda CX-5", type: "SUV", size: "Mid-Size", trans: "Automatic", fuel: "Gas", price: 75, img: "https://images.unsplash.com/photo-1621136138663-0498871691a5?auto=format&fit=crop&q=80&w=400" },
            { name: "Audi A4", type: "Luxury", size: "Compact", trans: "Automatic", fuel: "Gas", price: 120, img: "https://images.unsplash.com/photo-1606152424101-ad29bc788092?auto=format&fit=crop&q=80&w=400" },
            { name: "Nissan Leaf", type: "Electric", size: "Compact", trans: "Automatic", fuel: "Electric", price: 55, img: "https://images.unsplash.com/photo-1594535182308-8ffefbb661e1?auto=format&fit=crop&q=80&w=400" },
            { name: "Mercedes C-Class", type: "Luxury", size: "Mid-Size", trans: "Automatic", fuel: "Gas", price: 165, img: "https://images.unsplash.com/photo-1618843479313-40f8afb4b4d8?auto=format&fit=crop&q=80&w=400" },
            { name: "Volkswagen Golf", type: "Sedan", size: "Compact", trans: "Manual", fuel: "Gas", price: 48, img: "https://images.unsplash.com/photo-1541899481282-d53bffe3c35d?auto=format&fit=crop&q=80&w=400" },
            { name: "Hyundai Santa Fe", type: "SUV", size: "Mid-Size", trans: "Automatic", fuel: "Gas", price: 80, img: "https://images.unsplash.com/photo-1620591351163-9426bc0408ad?auto=format&fit=crop&q=80&w=400" },
            { name: "Ram 1500", type: "Truck", size: "Full-Size", trans: "Automatic", fuel: "Gas", price: 105, img: "https://images.unsplash.com/photo-1614200024976-03823034914c?auto=format&fit=crop&q=80&w=400" },
            { name: "Porsche 911", type: "Luxury", size: "Compact", trans: "Automatic", fuel: "Gas", price: 450, img: "https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&q=80&w=400" },
            { name: "Kia Soul", type: "Sedan", size: "Compact", trans: "Automatic", fuel: "Gas", price: 38, img: "https://images.unsplash.com/photo-1616788494707-ec28f08d05a1?auto=format&fit=crop&q=80&w=400" },
            { name: "Volvo XC90", type: "SUV", size: "Full-Size", trans: "Automatic", fuel: "Gas", price: 180, img: "https://images.unsplash.com/photo-1617469767053-d3b508a0d982?auto=format&fit=crop&q=80&w=400" },
            { name: "Subaru Crosstrek", type: "SUV", size: "Compact", trans: "Automatic", fuel: "Gas", price: 65, img: "https://images.unsplash.com/photo-1562911791-c7a97b729ec5?auto=format&fit=crop&q=80&w=400" },
            { name: "Lexus RX", type: "Luxury", size: "Full-Size", trans: "Automatic", fuel: "Gas", price: 145, img: "https://images.unsplash.com/photo-1514316454349-750a7fd3da3a?auto=format&fit=crop&q=80&w=400" }
        ];

        function renderCars(filteredList) {
            const grid = document.getElementById('fleetGrid');
            const count = document.getElementById('carCount');
            grid.innerHTML = '';
            count.innerText = `Showing ${filteredList.length} cars`;

            filteredList.forEach(car => {
                grid.innerHTML += `
                    <div class="bg-white rounded-2xl overflow-hidden shadow-sm border border-slate-100 hover:shadow-lg transition-all group">
                        <div class="relative overflow-hidden">
                            <img src="${car.img}" class="w-full h-48 object-cover group-hover:scale-110 transition duration-500">
                            <div class="absolute top-4 right-4 bg-white/90 backdrop-blur-sm px-3 py-1 rounded-full text-xs font-bold text-blue-600 shadow-sm">${car.type}</div>
                        </div>
                        <div class="p-6">
                            <div class="flex justify-between items-start mb-2">
                                <h3 class="text-xl font-bold text-slate-900">${car.name}</h3>
                                <div class="text-right">
                                    <span class="text-2xl font-black text-blue-600">$${car.price}</span>
                                    <span class="text-xs text-slate-400 block">/day</span>
                                </div>
                            </div>
                            <div class="flex gap-4 text-xs text-slate-500 mb-6 font-medium">
                                <span><i class="fas fa-cog mr-1"></i>${car.trans}</span>
                                <span><i class="fas fa-users mr-1"></i>5 Seats</span>
                                <span><i class="fas fa-suitcase mr-1"></i>Large</span>
                            </div>
                            <button class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700 transition">View Details</button>
                        </div>
                    </div>
                `;
            });
        }

        function handleFilter() {
            const selectedFilters = Array.from(document.querySelectorAll('.filter-check:checked')).map(c => c.value);
            
            if (selectedFilters.length === 0) {
                renderCars(cars);
                return;
            }

            const filtered = cars.filter(car => {
                return selectedFilters.includes(car.type) || 
                       selectedFilters.includes(car.size) || 
                       selectedFilters.includes(car.trans);
            });
            renderCars(filtered);
        }

        document.querySelectorAll('.filter-check').forEach(check => {
            check.addEventListener('change', handleFilter);
        });

        document.getElementById('clearFilters').addEventListener('click', () => {
            document.querySelectorAll('.filter-check').forEach(c => c.checked = false);
            renderCars(cars);
        });

        // Initial Load
        renderCars(cars);
    </script>
</body>
</html>
